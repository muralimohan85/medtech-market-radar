# Fictional six-month scenario for the replay evaluation and the demo.
#
# Every company, product, outlet, tender board, study number and figure here is invented.
# The items are written in the shape the real connectors return (openFDA 510(k) and recall
# records, ClinicalTrials.gov studies, PubMed abstracts, news/RSS items, licensed database
# rows) so the engine handles them exactly as it would live data.
#
# The engine only reads this file through the replay connector, which releases each item
# on its `published` date. The ground truth (which report sections each item should
# change, how material it is) lives in evaluation/scenario_labels.yaml, which the engine
# never reads.

watch: hs_troponin_poc
