[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medtech-market-radar"
version = "0.1.0"
description = "Market research and competitor analysis agent for medical devices: configurable sources, uploads, change-driven report refresh with citations and analyst approval."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Murali Mohan" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "pdfplumber>=0.11",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
app = ["streamlit>=1.66", "altair>=5.3", "pandas>=2.1"]
eval = ["matplotlib>=3.8", "reportlab>=4.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["radar*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]   # zip(xs, xs[1:]) pairs are intentionally unequal

[tool.ruff.lint.per-file-ignores]
"app/*" = ["E501"]   # inline HTML and CSS strings
